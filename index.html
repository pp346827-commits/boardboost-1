<!-- ================= FONTS ================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- ================= CSS ================= -->
<!--
  Note: utility classes are handled by Tailwind's runtime CDN build so the
  entire look/spacing system can live inline with no build step. Everything
  else (design tokens, routing, state, markup) is fully self-contained below
  with no external app code or frameworks.
-->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],

        colors: {
          ink: {
            950: '#05060b',
            900: '#0a0c15',
            850: '#0e1120',
          }
        }
      }
    }
  };
</script>

<!-- Official Supabase JS client. Loaded before the app script below so
     `window.supabase.createClient(...)` is available when the app boots. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --accent-1:#6d5efc;
    --accent-2:#22d3ee;
    --ring:rgba(109,94,252,.45);
  }
  html, body { margin:0; padding:0; scroll-behavior:smooth; background:#05060b; }
  body { font-family:'Inter', sans-serif; }
  h1,h2,h3,h4,.font-display{ font-family:'Space Grotesk', sans-serif; }
  .font-mono-label{ font-family:'JetBrains Mono', monospace; letter-spacing:.08em; }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:#05060b; }
  ::-webkit-scrollbar-thumb { background:#23263a; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:#31344a; }

  ::selection{ background:var(--accent-1); color:#fff; }

  :focus-visible{ outline:2px solid var(--accent-2); outline-offset:3px; border-radius:6px; }

  /* ---------- page transition ---------- */
  .fade-in { animation: fadeIn .5s cubic-bezier(.16,1,.3,1) both; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
  .rise { animation: rise .6s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { opacity:0; transform:translateY(16px);} to { opacity:1; transform:translateY(0);} }

  /* ---------- glass surfaces ---------- */
  .glass{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .glass-strong{
    background:rgba(15,17,28,.72);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
  }

  /* ---------- gradient text / borders ---------- */
  .grad-text{
    background:linear-gradient(90deg,var(--accent-1),var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .grad-border{ position:relative; }
  .grad-border::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg,rgba(109,94,252,.55),rgba(34,211,238,.25),transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events:none;
  }

  /* ---------- ambient blobs ---------- */
  .blob{ position:absolute; border-radius:9999px; filter:blur(90px); opacity:.35; pointer-events:none; }
  .blob-anim{ animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift{ from{ transform:translate(0,0) scale(1);} to{ transform:translate(30px,-24px) scale(1.08);} }

  /* ---------- card lift ---------- */
  .lift{ transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .35s, border-color .35s, background-color .35s; }
  .lift:hover{ transform:translateY(-4px); }

  /* ---------- buttons ---------- */
  .btn-primary{
    background:linear-gradient(90deg,var(--accent-1),#8b5cf6);
    box-shadow:0 8px 30px -8px rgba(109,94,252,.65);
    transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, filter .25s;
  }
  .btn-primary:hover{ transform:translateY(-2px); filter:brightness(1.08); box-shadow:0 12px 34px -6px rgba(109,94,252,.8); }
  .btn-primary:active{ transform:translateY(0); }
  .btn-ghost{ transition:background-color .25s, border-color .25s, transform .25s; }
  .btn-ghost:hover{ transform:translateY(-2px); }

  /* ---------- marquee ---------- */
  .marquee-track{ animation: marquee 28s linear infinite; }
  .marquee-track:hover{ animation-play-state:paused; }
  @keyframes marquee{ from{ transform:translateX(0);} to{ transform:translateX(-50%);} }

  /* ---------- chapter rail ---------- */
  .rail-line{
    background:linear-gradient(180deg,var(--accent-1),var(--accent-2) 60%,transparent);
  }
  .rail-dot{ box-shadow:0 0 0 4px #05060b, 0 0 14px 2px rgba(109,94,252,.65); }

  /* ---------- search overlay ---------- */
  .overlay-in{ animation: overlayIn .22s cubic-bezier(.16,1,.3,1) both; }
  @keyframes overlayIn{ from{ opacity:0; transform:scale(.97) translateY(-6px);} to{ opacity:1; transform:scale(1) translateY(0);} }

  /* ---------- toast ---------- */
  .toast-in{ animation: toastIn .35s cubic-bezier(.16,1,.3,1) both; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(10px) scale(.96);} to{ opacity:1; transform:translateY(0) scale(1);} }

  .skeleton{ background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.09) 37%,rgba(255,255,255,.04) 63%); background-size:400% 100%; animation:shimmer 1.6s ease infinite; }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }
</style>
</head>

  /* =====================================================================

  var SUPABASE_URL = "https://rwrryzejufppflmygdkf.supabase.co";           // e.g. "https://xxxxxxxxxxxx.supabase.co"
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3cnJ5emVqdWZwcGZsbXlnZGtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MTQwNjIsImV4cCI6MjEwMTM5MDA2Mn0.RNMkEi37qCz_Qhh29hILok43GGSTKBNIfAjW051bzFc"; // e.g. "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  // Table names, kept in one place in case they ever differ from the
  // defaults below (subjects / chapters / resources).
  var TABLES = { subjects: "subjects", chapters: "chapters", resources: "resources" };

  // App-wide constants: brand, nav links, resource type registry, icon set.

  var ICONS = {

    flask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.2L4.8 18a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9.2V3"/><path d="M8 15h8"/></svg>',
    function: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4c-2.5 0-3.5 1.6-3.8 4L4 20"/><path d="M6 11h5"/><path d="M12 20l6-9M12 11l6 9"/></svg>',
    bookOpen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.6-1.3-4-2-7-2v13c3 0 5.4.7 7 2 1.6-1.3 4-2 7-2V4.5c-3 0-5.4.7-7 2Z"/><path d="M12 6.5v13"/></svg>',
    code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-4 4 4 4M15 8l4 4-4 4"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    notes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
    formula: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h9l-4 8 4 8H6M13 12H4"/></svg>',
    pyqs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 1.9-2.4 3.6"/><circle cx="12" cy="16.6" r=".4" fill="currentColor"/></svg>',
    important: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5 14.9 9.4 21.4 10.3 16.7 14.8 17.9 21.3 12 18.2 6.1 21.3 7.3 14.8 2.6 10.3 9.1 9.4Z"/></svg>',
    assignments: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h3.5"/></svg>',
    videos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="13" height="13" rx="2"/><path d="M16 10.2 21 7v10l-5-3.2Z"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
    arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>',
    external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4 10 14M7 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8Z"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    checkGrid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 2.5 2.5L16 9"/></svg>'
  };

  /* =====================================================================
     SUPABASE
     Initialises the official client from the CDN script loaded in <head>.
     If the placeholders above haven't been replaced yet (or the client
     fails to initialise), `supabaseClient` stays null and the Data Layer
     transparently falls back to local demo data — nothing else in the
     app needs to know which mode it's running in.
     ===================================================================== */
  var supabaseClient = null;
  var IS_SUPABASE_CONFIGURED =
    SUPABASE_URL.indexOf("YOUR_SUPABASE_URL") === -1 &&
    SUPABASE_ANON_KEY.indexOf("YOUR_SUPABASE_ANON_KEY") === -1 &&
    SUPABASE_URL.trim().length > 0 &&
    SUPABASE_ANON_KEY.trim().length > 0;

  if (IS_SUPABASE_CONFIGURED && window.supabase && typeof window.supabase.createClient === "function") {
    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch (err) {
      console.error("boardboost: failed to initialise Supabase client.", err);
      supabaseClient = null;
    }
  } else if (IS_SUPABASE_CONFIGURED) {
    console.warn("boardboost: Supabase credentials are set but the client library did not load.");
  }

  // Resources are expected to store a ready-to-use URL in `file_url`
  // (either a public Storage bucket URL, or a signed URL generated
  // server-side). This just guards against blank/whitespace values.
  function resolveFileUrl(fileUrl) {
    return fileUrl && String(fileUrl).trim() ? String(fileUrl).trim() : null;
  }

  /* =====================================================================
     UTILITIES
     ===================================================================== */
  function el(html) {
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function qs(sel, ctx) { return (ctx || document).querySelector(sel); }
  function qsa(sel, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); }
  function navigate(hash) { window.location.hash = hash; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[c];
    });
  }
  function slugify(str) {
    return String(str).toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/(^-+|-+$)/g, "");
  }
  function titleCase(slug) {
    return String(slug).replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }
  function icon(name, cls) {
    return '<span class="' + (cls || "w-5 h-5") + ' inline-flex shrink-0">' + (ICONS[name] || "") + "</span>";
  }
  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  /* =====================================================================
     DATA LAYER
     Every read in the app goes through loadSubjects / loadChapters /
     loadResources / searchCatalog. Each one queries Supabase when
     `supabaseClient` is available, and falls back to local demo data
     (FALLBACK, below) when it isn't configured or a query errors out —
     so the UI, Router and Components never need to know which source
     answered the call.

     Expected schema:
       subjects  ( id, name )
       chapters  ( id, subject_id -> subjects.id, name )
       resources ( id, chapter_id -> chapters.id, type, title,
                   description, file_url )
     ===================================================================== */

  // Simulates an async fetch so fallback paths have the same shape as a
  // real Supabase call (`{ data, error }` handled, a Promise returned).
  function asPromise(value) {
    return new Promise(function (resolve) { resolve(value); });
  }

  // Cosmetic-only presets (icon + gradient) cycled across whatever
  // subjects come back from the database, since `subjects` only stores
  // id/name — the visual identity isn't part of the schema.
  var SUBJECT_STYLES = [
    { icon: "atom", gradient: "from-indigo-500 to-blue-500" },
    { icon: "flask", gradient: "from-emerald-500 to-teal-400" },
    { icon: "function", gradient: "from-violet-500 to-purple-500" },
    { icon: "bookOpen", gradient: "from-rose-500 to-orange-400" },
    { icon: "code", gradient: "from-amber-500 to-yellow-400" },
    { icon: "chart", gradient: "from-cyan-500 to-sky-400" }
  ];

  // Lookup from resource `type` (as stored in the resources table) to
  // its display metadata. Built once from RESOURCE_TYPES above.
  var RESOURCE_TYPE_BY_KEY = {};
  RESOURCE_TYPES.forEach(function (rt) { RESOURCE_TYPE_BY_KEY[rt.key] = rt; });
  // Types every chapter must always show a card for (Notes, Formula
  // Sheet, PYQs, Important Questions) — Assignments/Videos render only
  // when a row for them actually exists.
  var REQUIRED_RESOURCE_TYPES = RESOURCE_TYPES.filter(function (rt) { return !rt.optional; }).map(function (rt) { return rt.key; });

  // ---- row -> view-model mappers -----------------------------------
  function decorateSubject(row, index) {
    var style = SUBJECT_STYLES[(index || 0) % SUBJECT_STYLES.length];
    return {
      id: row.id,
      slug: slugify(row.name),
      title: row.name,
      icon: style.icon,
      gradient: style.gradient,
      description: "Chapter-wise notes, formula sheets, PYQs and important questions."
    };
  }
  function decorateChapter(row, index, subject) {
    return {
      id: row.id,
      slug: slugify(row.name),
      title: row.name,
      index: index + 1,
      subjectId: subject.id,
      subjectSlug: subject.slug
    };
  }
  function decorateResource(row) {
    var meta = RESOURCE_TYPE_BY_KEY[row.type] || { label: titleCase(row.type || "resource"), icon: "notes", desc: "" };
    return {
      id: row.id,
      type: row.type,
      label: row.title || meta.label,
      description: row.description || meta.desc,
      icon: meta.icon,
      fileUrl: resolveFileUrl(row.file_url),
      isPlaceholder: false
    };
  }
  function placeholderResource(typeKey) {
    var meta = RESOURCE_TYPE_BY_KEY[typeKey];
    return { id: null, type: typeKey, label: meta.label, description: meta.desc, icon: meta.icon, fileUrl: null, isPlaceholder: true };
  }

  // ---- local fallback data (used only when Supabase isn't configured,
  //      or a query fails) -------------------------------------------
  var FALLBACK = {
    subjects: [
      { id: "physics", name: "Physics" },
      { id: "chemistry", name: "Chemistry" },
      { id: "mathematics", name: "Mathematics" },
      { id: "english", name: "English" },
      { id: "computer-science", name: "Computer Science" },
      { id: "data-science", name: "Data Science" }
    ],
    chaptersBySubjectId: {
      physics: ["Electric Charges and Fields", "Electrostatic Potential", "Current Electricity", "Moving Charges and Magnetism", "Magnetism and Matter", "Electromagnetic Induction", "Alternating Current", "Ray Optics", "Wave Optics", "Dual Nature of Matter", "Atoms", "Nuclei", "Semiconductors"],
      chemistry: ["Solutions", "Electrochemistry", "Chemical Kinetics", "d and f Block Elements", "Coordination Compounds", "Haloalkanes and Haloarenes", "Alcohols, Phenols and Ethers", "Aldehydes, Ketones and Acids", "Amines", "Biomolecules"],
      mathematics: ["Relations and Functions", "Inverse Trigonometric Functions", "Matrices", "Determinants", "Continuity", "Differentiability", "Application of Derivatives", "Integrals", "Differential Equations", "Vectors", "Three Dimensional Geometry", "Probability"],
      english: ["The Last Lesson", "Lost Spring", "Deep Water", "The Rattrap", "Indigo", "Poets and Pancakes", "The Interview", "Going Places"],
      "computer-science": ["Python Revision", "Functions", "File Handling", "MySQL", "Computer Networks", "Data Structures"],
      "data-science": ["Introduction to Data Science", "Data Collection", "Data Cleaning", "Visualisation", "Machine Learning Basics"]
    }
  };
  function fallbackChapters(subject) {
    var names = FALLBACK.chaptersBySubjectId[subject.id] || [];
    return names.map(function (name, index) {
      return decorateChapter({ id: subject.id + "-" + slugify(name), subject_id: subject.id, name: name }, index, subject);
    });
  }

  // ---- public data-layer API -----------------------------------------

  // GET subjects — mirrors: supabase.from('subjects').select('id, name')
  function loadSubjects() {
    if (supabaseClient) {
      return supabaseClient
        .from(TABLES.subjects)
        .select("id, name")
        .order("name", { ascending: true })
        .then(function (res) {
          if (res.error) throw res.error;
          return res.data.map(decorateSubject);
        })
        .catch(function (err) {
          console.warn("boardboost: loadSubjects() fell back to local data.", err);
          return FALLBACK.subjects.map(decorateSubject);
        });
    }
    return asPromise(FALLBACK.subjects.map(decorateSubject));
  }

  function loadSubject(subjectSlug) {
    return loadSubjects().then(function (subjects) {
      return subjects.find(function (s) { return s.slug === subjectSlug; }) || null;
    });
  }

  // GET chapters for a subject — mirrors:
  // supabase.from('chapters').select('id, subject_id, name').eq('subject_id', subject.id)
  // `subject` is the decorated object returned by loadSubject()/loadSubjects().
  function loadChapters(subject) {
    if (!subject) return asPromise([]);

    if (supabaseClient) {
      return supabaseClient
        .from(TABLES.chapters)
        .select("id, subject_id, name")
        .eq("subject_id", subject.id)
        .order("id", { ascending: true })
        .then(function (res) {
          if (res.error) throw res.error;
          return res.data.map(function (row, index) { return decorateChapter(row, index, subject); });
        })
        .catch(function (err) {
          console.warn("boardboost: loadChapters() fell back to local data.", err);
          return fallbackChapters(subject);
        });
    }
    return asPromise(fallbackChapters(subject));
  }

  function loadChapter(subject, chapterSlug) {
    return loadChapters(subject).then(function (chapters) {
      return chapters.find(function (c) { return c.slug === chapterSlug; }) || null;
    });
  }

  // GET resources for a chapter — mirrors:
  // supabase.from('resources').select('id, chapter_id, type, title, description, file_url').eq('chapter_id', chapter.id)
  // `chapter` is the decorated object returned by loadChapter()/loadChapters().
  // Always resolves with a card for every REQUIRED_RESOURCE_TYPES entry,
  // using a placeholder (fileUrl: null) when the database has no row yet.
  function loadResources(chapter) {
    if (!chapter) return asPromise([]);

    var fetchPromise = supabaseClient
      ? supabaseClient
          .from(TABLES.resources)
          .select("id, chapter_id, type, title, description, file_url")
          .eq("chapter_id", chapter.id)
          .then(function (res) {
            if (res.error) throw res.error;
            return res.data.map(decorateResource);
          })
          .catch(function (err) {
            console.warn("boardboost: loadResources() query failed.", err);
            return [];
          })
      : asPromise([]);

    return fetchPromise.then(function (rows) {
      var byType = {};
      rows.forEach(function (r) { byType[r.type] = true; });
      REQUIRED_RESOURCE_TYPES.forEach(function (typeKey) {
        if (!byType[typeKey]) rows.push(placeholderResource(typeKey));
      });
      return rows;
    });
  }

  // Cross-entity search across subjects, chapters and resource types —
  // powers the Cmd+K palette and the Notes page search box.
  function searchCatalog(query) {
    var q = (query || "").trim().toLowerCase();
    if (!q) return asPromise({ subjects: [], chapters: [], resources: [] });

    return loadSubjects().then(function (subjects) {
      var matchedSubjects = subjects.filter(function (s) {
        return s.title.toLowerCase().indexOf(q) !== -1;
      });

      var chapterPromises = subjects.map(function (s) {
        return loadChapters(s).then(function (chapters) {
          return chapters
            .filter(function (c) { return c.title.toLowerCase().indexOf(q) !== -1; })
            .map(function (c) { return Object.assign({}, c, { subjectTitle: s.title }); });
        });
      });

      return Promise.all(chapterPromises).then(function (groups) {
        var matchedChapters = [].concat.apply([], groups);

        var matchedResources = [];
        subjects.forEach(function (s) {
          RESOURCE_TYPES.forEach(function (rt) {
            if (rt.label.toLowerCase().indexOf(q) !== -1) {
              matchedResources.push({ key: rt.key, label: rt.label, icon: rt.icon, subjectSlug: s.slug, subjectTitle: s.title });
            }
          });
        });

        return {
          subjects: matchedSubjects.slice(0, 5),
          chapters: matchedChapters.slice(0, 6),
          resources: matchedResources.slice(0, 6)
        };
      });
    });
  }

  function openSearchOverlay() {
    if (qs("#search-overlay")) return;

    var overlay = el(
      '<div id="search-overlay" class="fixed inset-0 z-[70] flex items-start justify-center pt-24 px-4">' +
        '<div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>' +

          '</div>' +
          '<div id="search-results" class="max-h-[60vh] overflow-y-auto p-2"></div>' +
        '</div>' +
      '</div>'
    );
    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";

    var input = qs("#search-input", overlay);
    var resultsBox = qs("#search-results", overlay);
    input.focus();

    function close() {
      document.body.style.overflow = "";
      overlay.remove();
    }
    overlay.addEventListener("click", function (e) { if (e.target === overlay || e.target.classList.contains("bg-black/70")) close(); });
    qs("#search-close", overlay).addEventListener("click", close);
    document.addEventListener("keydown", function escHandler(e) {
      if (e.key === "Escape") { close(); document.removeEventListener("keydown", escHandler); }
    });

    function renderGroup(title, items, mapFn) {
      if (!items.length) return "";
      return (
        '<div class="px-3 pt-3 pb-1 font-mono-label text-[10px] text-slate-500 uppercase">' + title + '</div>' +
        items.map(mapFn).join("")
      );
    }

    function renderResults(q) {
      resultsBox.innerHTML = '<div class="px-4 py-8 text-center text-slate-500 text-sm">Type to search across subjects, chapters and resources.</div>';
      if (!q.trim()) return;

      searchCatalog(q).then(function (res) {
        var hasAny = res.subjects.length || res.chapters.length || res.resources.length;
        if (!hasAny) {
          resultsBox.innerHTML = '<div class="px-4 py-8 text-center text-slate-500 text-sm">No matches for "' + escapeHtml(q) + '".</div>';
          return;
        }
        resultsBox.innerHTML =
          renderGroup("Subjects", res.subjects, function (s) {
            return '<a href="#/subject/' + s.slug + '" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 text-slate-200 text-sm">' +
              '<span class="w-7 h-7 rounded-lg bg-gradient-to-br ' + s.gradient + ' flex items-center justify-center text-white">' + icon(s.icon, "w-3.5 h-3.5") + '</span>' +
              escapeHtml(s.title) + '</a>';
          }) +
          renderGroup("Chapters", res.chapters, function (c) {
            return '<a href="#/subject/' + c.subjectSlug + '/' + c.slug + '" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 text-slate-200 text-sm">' +
              icon("layers", "w-4 h-4 text-slate-500") +
              '<span class="flex-1 truncate">' + escapeHtml(c.title) + '</span>' +
              '<span class="text-slate-500 text-xs">' + escapeHtml(c.subjectTitle) + '</span></a>';
          }) +
          renderGroup("Resources", res.resources, function (r) {
            return '<a href="#/subject/' + r.subjectSlug + '" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 text-slate-200 text-sm">' +
              icon(r.icon, "w-4 h-4 text-slate-500") +
              '<span class="flex-1 truncate">' + escapeHtml(r.label) + '</span>' +
              '<span class="text-slate-500 text-xs">' + escapeHtml(r.subjectTitle) + '</span></a>';
          });

        qsa("a", resultsBox).forEach(function (a) { a.addEventListener("click", close); });
      });
    }

    input.addEventListener("input", debounce(function (e) { renderResults(e.target.value); }, 150));
    renderResults("");
  }

            return '<div class="lift glass rounded-2xl p-6">' +
              '<div class="w-11 h-11 rounded-xl bg-white/[.06] border border-white/10 flex items-center justify-center text-[var(--accent-2)]">' + icon(i[0], "w-5 h-5") + '</div>' +
              '<h3 class="font-display text-white font-semibold text-lg mt-4">' + i[1] + '</h3>' +
              '<p class="text-slate-400 mt-1.5 text-sm leading-relaxed">' + i[2] + '</p>' +
            '</div>';
          }).join("") +
        '</div>' +
      '</section>'
    );
  }

  function Stats() {
    var stats = [["6", "Subjects"], ["70+", "Chapters"], ["6", "Resource types"], ["24/7", "Access"]];
    return (
      '<section class="border-y border-white/[.06] bg-white/[.02]">' +
        '<div class="max-w-7xl mx-auto px-6 py-16 grid grid-cols-2 md:grid-cols-4 gap-8 text-center">' +
          stats.map(function (s) {
            return '<div><div class="font-display text-4xl font-bold grad-text">' + s[0] + '</div>' +
              '<div class="text-slate-400 mt-2 text-sm">' + s[1] + '</div></div>';
          }).join("") +
        '</div>' +
      '</section>'
    );
  }

  function CTA() {
    return (
      '<section class="max-w-6xl mx-auto px-6 py-24">' +
        '<div class="grad-border relative rounded-3xl overflow-hidden glass-strong px-8 py-16 md:py-20 text-center">' +
          '<div class="blob w-[380px] h-[380px] bg-[var(--accent-1)] left-1/2 -translate-x-1/2 -top-32 opacity-25"></div>' +
          '<div class="relative">' +
            '<h2 class="font-display text-3xl md:text-5xl font-bold text-white">Ready to boost your boards?</h2>' +
            '<p class="text-slate-400 mt-4 text-lg max-w-lg mx-auto">Jump straight into any subject and get instant access to every chapter.</p>' +
            '<a href="#/notes" class="btn-primary inline-flex items-center gap-2 mt-8 text-white px-10 py-4 rounded-xl font-semibold">Browse Subjects' + icon("arrowRight", "w-4 h-4") + '</a>' +
          '</div>' +
        '</div>' +
      '</section>'
    );
  }

  function DashboardPage() {
    var wrap = el('<div class="min-h-screen fade-in"></div>');
    wrap.appendChild(Navbar("#/"));
    wrap.appendChild(el(Hero()));
    var subjectStripMount = el('<div></div>');
    wrap.appendChild(subjectStripMount);
    loadSubjects().then(function (subjects) {
      subjectStripMount.replaceWith(el(SubjectStrip(subjects)));
    });
    wrap.appendChild(el(Features()));
    wrap.appendChild(el(Stats()));
    wrap.appendChild(el(CTA()));
    wrap.appendChild(Footer());
    var heroSearchBtn = qs("#hero-search-btn", wrap);
    if (heroSearchBtn) heroSearchBtn.addEventListener("click", openSearchOverlay);
    return wrap;
  }

  function NotesPage() {
    var wrap = el(
      '<div class="min-h-screen fade-in">' +
        '<section class="relative overflow-hidden border-b border-white/[.06]">' +
          '<div class="blob blob-anim w-[420px] h-[420px] bg-[var(--accent-1)] -top-32 left-1/3"></div>' +
          '<div class="relative max-w-5xl mx-auto px-6 pt-20 pb-16 text-center">' +
            '<span class="font-mono-label text-xs text-[var(--accent-2)]">CLASS 12 · SCIENCE</span>' +
            '<h1 class="font-display text-4xl md:text-6xl font-bold text-white mt-3">Choose a <span class="grad-text">subject</span></h1>' +
            '<p class="text-slate-400 mt-4 text-lg">Pick where to start — every chapter is fully stocked.</p>' +
            '<div class="mt-9 max-w-xl mx-auto relative">' +
              icon("search", "w-4 h-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2") +
              '<input type="text" id="notes-search" placeholder="Search subjects, chapters or resources…" class="w-full pl-11 pr-4 py-3.5 rounded-xl glass text-white placeholder-slate-500 outline-none focus:border-[var(--accent-1)]/60 transition-colors" />' +
            '</div>' +
          '</div>' +
        '</section>' +
        '<div class="max-w-7xl mx-auto px-6 py-16">' +
          '<div id="subject-grid" class="grid sm:grid-cols-2 md:grid-cols-3 gap-6"></div>' +
          '<div id="chapter-results" class="mt-10 hidden"></div>' +
        '</div>' +
      '</div>'
    );
    wrap.insertBefore(Navbar("#/notes"), wrap.firstChild);
    wrap.appendChild(Footer());

    var grid = qs("#subject-grid", wrap);
    grid.innerHTML = SkeletonGrid(6, "h-48");

    loadSubjects().then(function (subjects) {
      function renderSubjects(list) {
        grid.innerHTML = list.length
          ? list.map(SubjectCard).join("")
          : '<div class="sm:col-span-2 md:col-span-3 text-center text-slate-500 py-16">No subjects match your search.</div>';
      }
      renderSubjects(subjects);

      var chapterResults = qs("#chapter-results", wrap);
      var searchDebounced = debounce(function (value) {
        var q = value.trim().toLowerCase();
        if (!q) {
          renderSubjects(subjects);
          chapterResults.classList.add("hidden");
          chapterResults.innerHTML = "";
          return;
        }
        renderSubjects(subjects.filter(function (s) { return s.title.toLowerCase().indexOf(q) !== -1; }));

        searchCatalog(value).then(function (res) {
          var extra = res.chapters.concat(res.resources.map(function (r) {
            return { title: r.label, slug: "", subjectSlug: r.subjectSlug, subjectTitle: r.subjectTitle, isResource: true, icon: r.icon };
          }));
          if (!extra.length) { chapterResults.classList.add("hidden"); chapterResults.innerHTML = ""; return; }
          chapterResults.classList.remove("hidden");
          chapterResults.innerHTML =
            '<h3 class="font-mono-label text-xs text-slate-500 uppercase mb-4">Matching chapters &amp; resources</h3>' +
            '<div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3">' +
              extra.map(function (c) {
                var href = c.isResource ? "#/subject/" + c.subjectSlug : "#/subject/" + c.subjectSlug + "/" + c.slug;
                return '<a href="' + href + '" class="lift glass rounded-xl px-4 py-3 flex items-center gap-3">' +
                  icon(c.isResource ? c.icon : "layers", "w-4 h-4 text-slate-500 shrink-0") +
                  '<span class="min-w-0"><span class="block text-sm text-slate-200 truncate">' + escapeHtml(c.title) + '</span>' +
                  '<span class="block text-xs text-slate-500">' + escapeHtml(c.subjectTitle) + '</span></span></a>';
              }).join("") +
            '</div>';
        });
      }, 180);

      qs("#notes-search", wrap).addEventListener("input", function (e) { searchDebounced(e.target.value); });
    });

    return wrap;
  }

  function SubjectPage(subjectSlug) {
    var wrap = el('<div class="min-h-screen fade-in"></div>');
    wrap.appendChild(Navbar("#/notes"));

    var content = el('<div></div>');
    content.innerHTML =
      '<div class="max-w-5xl mx-auto px-6 py-16">' +
        '<div class="skeleton h-8 w-40 rounded-lg mb-6"></div>' +
        '<div class="skeleton h-12 w-72 rounded-lg mb-3"></div>' +
        '<div class="skeleton h-5 w-96 max-w-full rounded-lg mb-12"></div>' +
        SkeletonGrid(4, "h-16") +
      '</div>';
    wrap.appendChild(content);
    wrap.appendChild(Footer());

    loadSubject(subjectSlug).then(function (subject) {
      if (!subject) return [null, []];
      return loadChapters(subject).then(function (chapters) { return [subject, chapters]; });
    }).then(function (results) {
      var subject = results[0];
      var chapters = results[1];

      if (!subject) {
        content.innerHTML = '<div class="max-w-3xl mx-auto px-6 py-24 text-center">' +
          '<h1 class="font-display text-3xl font-bold text-white">Subject not found</h1>' +
          '<a href="#/notes" class="inline-block mt-6 text-[var(--accent-2)] hover:underline">&larr; Back to Notes</a></div>';
        return;
      }

      var rows = chapters.map(function (c, i) { return ChapterRow(c, subject, i === chapters.length - 1); }).join("");

      content.innerHTML =
        '<div class="relative overflow-hidden border-b border-white/[.06]">' +
          '<div class="blob blob-anim w-[380px] h-[380px] bg-gradient-to-br ' + subject.gradient + ' -top-28 left-10 opacity-20"></div>' +
          '<div class="relative max-w-5xl mx-auto px-6 pt-14 pb-14">' +
            '<nav class="text-sm text-slate-500 flex items-center gap-2 mb-8">' +
              '<a href="#/notes" class="hover:text-white transition-colors">Notes</a><span>/</span><span class="text-slate-300">' + escapeHtml(subject.title) + '</span>' +
            '</nav>' +
            '<div class="flex items-center gap-4">' +
              '<div class="w-14 h-14 rounded-2xl bg-gradient-to-br ' + subject.gradient + ' flex items-center justify-center text-white shadow-lg">' + icon(subject.icon, "w-7 h-7") + '</div>' +
              '<div>' +
                '<h1 class="font-display text-3xl md:text-4xl font-bold text-white">' + escapeHtml(subject.title) + '</h1>' +
                '<p class="text-slate-400 mt-1">' + chapters.length + ' chapters</p>' +
              '</div>' +
            '</div>' +
            '<p class="text-slate-400 mt-6 max-w-2xl leading-relaxed">' + escapeHtml(subject.description) + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="max-w-3xl mx-auto px-6 py-16">' +
          '<h2 class="font-mono-label text-xs text-slate-500 uppercase mb-8">Select a chapter</h2>' +
          '<div>' + rows + '</div>' +
        '</div>';
    });

    return wrap;
  }

  function ChapterPage(subjectSlug, chapterSlug) {
    var wrap = el('<div class="min-h-screen fade-in"></div>');
    wrap.appendChild(Navbar("#/notes"));

    var content = el('<div></div>');
    content.innerHTML =
      '<div class="max-w-5xl mx-auto px-6 py-16">' +
        '<div class="skeleton h-8 w-56 rounded-lg mb-6"></div>' +
        '<div class="skeleton h-12 w-80 max-w-full rounded-lg mb-12"></div>' +
        SkeletonGrid(6, "h-44") +
      '</div>';
    wrap.appendChild(content);
    wrap.appendChild(Footer());

    loadSubject(subjectSlug)
      .then(function (subject) {
        if (!subject) return [null, null, []];
        return loadChapter(subject, chapterSlug).then(function (chapter) {
          if (!chapter) return [subject, null, []];
          return loadResources(chapter).then(function (resources) { return [subject, chapter, resources]; });
        });
      })
      .then(function (results) {
        var subject = results[0], chapter = results[1], resources = results[2];

        if (!subject || !chapter) {
          content.innerHTML = '<div class="max-w-3xl mx-auto px-6 py-24 text-center">' +
            '<h1 class="font-display text-3xl font-bold text-white">Chapter not found</h1>' +
            '<a href="#/subject/' + escapeHtml(subjectSlug) + '" class="inline-block mt-6 text-[var(--accent-2)] hover:underline">&larr; Back to subject</a></div>';
          return;
        }

        var cards = resources.map(ResourceCard).join("");

        content.innerHTML =
          '<div class="relative overflow-hidden border-b border-white/[.06]">' +
            '<div class="blob blob-anim w-[340px] h-[340px] bg-gradient-to-br ' + subject.gradient + ' -top-24 right-10 opacity-20"></div>' +
            '<div class="relative max-w-5xl mx-auto px-6 pt-14 pb-14">' +
              '<nav class="text-sm text-slate-500 flex items-center gap-2 mb-8 flex-wrap">' +
                '<a href="#/notes" class="hover:text-white transition-colors">Notes</a><span>/</span>' +
                '<a href="#/subject/' + subject.slug + '" class="hover:text-white transition-colors">' + escapeHtml(subject.title) + '</a><span>/</span>' +
                '<span class="text-slate-300">' + escapeHtml(chapter.title) + '</span>' +
              '</nav>' +
              '<div class="flex items-center gap-3 flex-wrap">' +
                '<span class="inline-flex items-center gap-1.5 text-xs font-medium text-white bg-gradient-to-br ' + subject.gradient + ' rounded-full px-3 py-1">' + icon(subject.icon, "w-3 h-3") + escapeHtml(subject.title) + '</span>' +
                '<span class="font-mono-label text-xs text-slate-500">CHAPTER ' + String(chapter.index).padStart(2, "0") + '</span>' +
              '</div>' +
              '<h1 class="font-display text-3xl md:text-5xl font-bold text-white mt-4">' + escapeHtml(chapter.title) + '</h1>' +
            '</div>' +
          '</div>' +
          '<div class="max-w-5xl mx-auto px-6 py-16">' +
            '<h2 class="font-mono-label text-xs text-slate-500 uppercase mb-8">Study material</h2>' +
            '<div class="grid sm:grid-cols-2 md:grid-cols-3 gap-5" id="resource-grid">' + cards + '</div>' +
          '</div>';

        qsa("[data-empty-resource]", content).forEach(function (btn) {
          btn.addEventListener("click", function () {
            var label = btn.getAttribute("data-empty-resource") || "This resource";
            Toast("\u201c" + label + "\u201d hasn\u2019t been uploaded to Supabase yet.");
          });
        });
      });

    return wrap;
  }

  function NotFoundPage() {
    var wrap = el(
      '<div class="min-h-screen flex flex-col items-center justify-center text-center px-6 fade-in">' +
        '<span class="font-display text-7xl font-bold grad-text">404</span>' +
        '<p class="text-slate-400 mt-3 text-lg">This page doesn\u2019t exist.</p>' +
        '<a href="#/" class="btn-primary inline-flex items-center gap-2 mt-8 text-white px-6 py-3 rounded-xl font-semibold">Go home</a>' +
      '</div>'
    );
    return wrap;
  }

  /* =====================================================================
     ROUTER
     Hash-based, matches the routes the original app exposed (minus the
     removed /login and /signup routes).
     ===================================================================== */
  function render() {
    var hash = window.location.hash || "#/";
    var path = hash.slice(1);
    if (path === "" || path === "/") { path = "/"; }
    var parts = path.split("/").filter(Boolean);

    var closeOverlay = qs("#search-overlay");
    if (closeOverlay) { closeOverlay.remove(); document.body.style.overflow = ""; }

    root.innerHTML = "";
    window.scrollTo(0, 0);

    if (parts.length === 0) {
      root.appendChild(DashboardPage());
    } else if (parts[0] === "notes" && parts.length === 1) {
      root.appendChild(NotesPage());
    } else if (parts[0] === "subject" && parts.length === 2) {
      root.appendChild(SubjectPage(decodeURIComponent(parts[1])));
    } else if (parts[0] === "subject" && parts.length === 3) {
      root.appendChild(ChapterPage(decodeURIComponent(parts[1]), decodeURIComponent(parts[2])));
    } else {
      root.appendChild(NotFoundPage());
    }
  }

  /* =====================================================================
     EVENT HANDLERS / INIT
     ===================================================================== */
  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);
  render();
})();
</script>
</body>
</html>
